<!DOCTYPE html>
<html lang="en" data-theme="warm">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0"/>
  <title>Reader — lookataslam</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>

  <style>
    .reader-topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--nav-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-subtle);
      transition: background-color 0.3s;
    }

    .topbar-primary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
      padding: 0 20px;
      gap: 12px;
    }

    .back-brand {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-main);
      text-decoration: none;
      flex-shrink: 0;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .topbar-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 20px 10px;
      border-top: 1px dashed var(--border-subtle);
      gap: 12px;
      flex-wrap: wrap;
    }

    .selector-group {
      display: flex;
      gap: 8px;
      flex: 1;
      max-width: 460px;
      flex-wrap: wrap;
    }

    .chapter-dropdown, .novel-dropdown {
      font-family: inherit;
      font-weight: 700;
      font-size: 0.88rem;
      padding: 6px 14px;
      border-radius: var(--btn-radius);
      border: 1.5px solid var(--border);
      background: var(--bg-surface);
      color: var(--text-main);
      outline: none;
      text-overflow: ellipsis;
    }

    .novel-dropdown {
      max-width: 190px;
      background: var(--bg-subtle);
    }

    .chapter-dropdown {
      flex: 1;
      max-width: 250px;
    }

    .reader-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .size-btn, .action-pill-btn {
      border: 1.5px solid var(--border);
      background: var(--bg-surface);
      color: var(--text-main);
      border-radius: var(--btn-radius);
      padding: 4px 10px;
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
      line-height: 1.2;
      transition: all 0.15s;
    }

    .action-pill-btn:hover {
      background: var(--accent-light);
    }

    .reading-progress {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      background: var(--accent);
      z-index: 101;
      width: 0%;
      transition: width 0.1s ease-out;
    }

    .reader-container {
      max-width: 680px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }

    .reader-header {
      text-align: center;
      margin-bottom: 36px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .series-kicker {
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--accent);
      margin-bottom: 6px;
    }

    .chapter-meta-details {
      display: flex;
      justify-content: center;
      gap: 16px;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .chapter-heading {
      font-family: 'Newsreader', Georgia, serif;
      font-size: clamp(1.8rem, 4.5vw, 2.5rem);
      font-weight: 600;
      line-height: 1.2;
      margin-bottom: 4px;
      letter-spacing: -0.01em;
    }

    .chapter-subnum {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .reader-article {
      font-family: 'Newsreader', Georgia, serif;
      font-size: var(--novel-font-size, 1.2rem);
      line-height: 1.85;
      color: var(--text-main);
    }

    .reading-para {
      margin-bottom: 1.6em;
      text-indent: 1.5em;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.4s ease-out, transform 0.4s ease-out;
      will-change: opacity, transform;
    }

    .reading-para.para-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .reading-para:first-of-type {
      text-indent: 0;
    }

    /* Copy protection: allow visual selection, block clipboard */
    .reader-article {
      -webkit-touch-callout: none;
    }

    /* Lock banner for scheduled unreleased chapters */
    .scheduled-lock-card {
      background: var(--bg-surface);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 40px 24px;
      text-align: center;
      box-shadow: var(--clay-shadow);
      margin: 40px 0;
    }
    .scheduled-lock-card h3 {
      font-size: 1.4rem;
      margin-bottom: 8px;
    }
    .scheduled-lock-card p {
      font-size: 0.95rem;
      max-width: 480px;
      margin: 0 auto 20px;
      color: var(--text-muted);
    }

    .reader-footer-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 40px;
      padding-top: 24px;
      border-top: 1.5px solid var(--border-subtle);
      gap: 12px;
    }

    .cookie-companion-float {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 90;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: auto;
      cursor: pointer;
      user-select: none;
      transition: transform 0.3s ease;
    }

    .cookie-companion-float:hover {
      transform: scale(1.08);
    }

    .cookie-stage {
      width: 72px;
      height: 60px;
      position: relative;
    }

    .cookie-svg-actor {
      width: 100%;
      height: 100%;
      transition: all 0.4s ease;
    }

    .cookie-status-bubble {
      background: var(--bg-surface);
      border: 1.5px solid var(--border);
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-main);
      box-shadow: 2px 2px 0 var(--border);
      margin-bottom: 4px;
      white-space: nowrap;
    }

    .anim-walking {
      animation: cookieWalk 1.4s ease-in-out infinite alternate;
    }
    @keyframes cookieWalk {
      0% { transform: translateX(-8px) rotate(-3deg); }
      100% { transform: translateX(8px) rotate(3deg); }
    }

    .anim-sleeping {
      transform: rotate(6deg) scale(0.92);
      opacity: 0.85;
    }

    .anim-idle {
      animation: cookieBreathe 3s ease-in-out infinite;
    }
    @keyframes cookieBreathe {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    @media (max-width: 600px) {
      .topbar-primary { height: 50px; padding: 0 14px; }
      .topbar-controls { padding: 6px 14px 8px; }
      .selector-group { max-width: 100%; width: 100%; }
      .novel-dropdown, .chapter-dropdown { max-width: 100%; width: 100%; }
      .reader-container { padding: 24px 16px 60px; }
      .reader-article {
        font-size: var(--novel-font-size, 1.12rem);
        line-height: 1.78;
      }
      .reading-para { margin-bottom: 1.4em; text-indent: 1.2em; }
      .reader-footer-nav { flex-direction: column; gap: 14px; }
      .reader-footer-nav .btn { width: 100%; }
      .cookie-companion-float { bottom: 16px; right: 16px; }
    }
  </style>
</head>
<body>

  <div class="reading-progress" id="progressBar"></div>

  <!-- Reader Topbar -->
  <header class="reader-topbar">
    <div class="topbar-primary">
      <a href="index.html" class="back-brand">&larr; lookataslam</a>

      <div class="topbar-right">
        <button id="toggleCatBtn" class="action-pill-btn" title="Toggle Cookie companion">🐱 Cookie</button>
        <button id="bookmarkBtn" class="action-pill-btn" title="Bookmark current chapter">🔖 Bookmark</button>

        <div class="theme-picker" role="radiogroup" aria-label="Theme selection">
          <button class="theme-pill active" data-theme-btn="warm">Warm</button>
          <button class="theme-pill" data-theme-btn="night">Night</button>
          <button class="theme-pill" data-theme-btn="sage">Sage</button>
        </div>
      </div>
    </div>

    <!-- Novel & Chapter Selectors -->
    <div class="topbar-controls">
      <div class="selector-group">
        <select id="novelSelect" class="novel-dropdown" aria-label="Select Novel">
          <option value="jalwa">JALWA (Vol. 1)</option>
          <option value="jalwa_v2">JALWA (Vol. 2 · Dec 10)</option>
          <option value="sabu">The Silly Mistakes of Sabu</option>
        </select>
        <select id="chapterSelect" class="chapter-dropdown" aria-label="Select Chapter"></select>
      </div>

      <div class="reader-actions">
        <button id="shareChapterBtn" class="size-btn" title="Share Chapter Link">Share</button>
        <button id="fontDown" class="size-btn" aria-label="Decrease font size">A&minus;</button>
        <button id="fontUp" class="size-btn" aria-label="Increase font size">A&#43;</button>
      </div>
    </div>
  </header>

  <!-- Reading Layout -->
  <main class="reader-container">
    <header class="reader-header">
      <div class="series-kicker" id="novelSeriesTitle">Just a Little While Apart &middot; Volume 1</div>
      <div class="chapter-subnum" id="chapterNum">Chapter 1</div>
      <h1 class="chapter-heading" id="chapterTitle">A Dart of Marriage</h1>
      <div class="chapter-meta-details">
        <span id="readTime">~8 min read</span> &middot;
        <span id="wordCount">2,043 words</span>
      </div>
    </header>

    <article class="reader-article" id="readerText">
      <!-- Paragraphs dynamically rendered -->
    </article>

    <!-- Navigation between chapters -->
    <div class="reader-footer-nav">
      <button id="prevBtn" class="btn btn-secondary">&larr; Previous Chapter</button>
      <span id="pageIndicator" style="font-weight: 700; font-size: 0.9rem;">1 / 10</span>
      <button id="nextBtn" class="btn btn-primary">Next Chapter &rarr;</button>
    </div>
  </main>

  <!-- Cookie Companion -->
  <aside class="cookie-companion-float" id="cookieFloat" aria-label="Cookie the cat companion" title="Click to interact with Cookie!">
    <div class="cookie-status-bubble" id="cookieStatus">curled up 🐾</div>
    <div class="cookie-stage" id="cookieStage">
      <svg class="cookie-svg-actor anim-idle" id="cookieSvgActor" viewBox="0 0 100 85" fill="none" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="50" cy="55" rx="30" ry="22" fill="#fff5ea" stroke="#22201d" stroke-width="2.5"/>
        <path d="M60 40 Q75 42 70 60 Q55 58 60 40 Z" fill="#d97757" opacity="0.85"/>
        <path d="M28 48 Q40 50 35 65 Q25 64 28 48 Z" fill="#22201d" opacity="0.3"/>
        <path id="cookieTail" d="M78 58 Q92 50 88 40 Q84 34 76 42" stroke="#22201d" stroke-width="3" stroke-linecap="round"/>
        <circle cx="50" cy="32" r="22" fill="#fff5ea" stroke="#22201d" stroke-width="2.5"/>
        <path d="M54 12 Q68 18 64 30 Q50 25 54 12 Z" fill="#d97757" opacity="0.85"/>
        <polygon points="32,18 24,4 42,12" fill="#fff5ea" stroke="#22201d" stroke-width="2"/>
        <polygon points="33,16 27,7 40,12" fill="#ffb3c6"/>
        <polygon points="68,18 76,4 58,12" fill="#fff5ea" stroke="#22201d" stroke-width="2"/>
        <polygon points="67,16 73,7 60,12" fill="#ffb3c6"/>
        <g id="cookieEyesOpen">
          <circle cx="43" cy="32" r="3.5" fill="#22201d"/>
          <circle cx="57" cy="32" r="3.5" fill="#22201d"/>
          <circle cx="44.5" cy="30.5" r="1.2" fill="#fff"/>
          <circle cx="58.5" cy="30.5" r="1.2" fill="#fff"/>
        </g>
        <polygon points="50,37 47.5,40 52.5,40" fill="#ffb3c6"/>
        <path d="M47.5 40 Q50 43 52.5 40" stroke="#22201d" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="24" y1="38" x2="38" y2="38" stroke="#22201d" stroke-width="1.2" opacity="0.6"/>
        <line x1="24" y1="41" x2="38" y2="40" stroke="#22201d" stroke-width="1.2" opacity="0.6"/>
        <line x1="62" y1="38" x2="76" y2="38" stroke="#22201d" stroke-width="1.2" opacity="0.6"/>
        <line x1="62" y1="40" x2="76" y2="41" stroke="#22201d" stroke-width="1.2" opacity="0.6"/>
        <ellipse cx="40" cy="74" rx="9" ry="5" fill="#fff5ea" stroke="#22201d" stroke-width="2"/>
        <ellipse cx="60" cy="74" rx="9" ry="5" fill="#fff5ea" stroke="#22201d" stroke-width="2"/>
      </svg>
    </div>
  </aside>

  <script src="chapters-data.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    let activeNovelKey = urlParams.get('novel') || 'jalwa';
    if (!NOVELS[activeNovelKey]) activeNovelKey = 'jalwa';

    let currentChapter = 0;
    let fontSizeRem = window.innerWidth <= 600 ? 1.12 : 1.2;

    // Theme Logic
    const themeButtons = document.querySelectorAll('[data-theme-btn]');
    const savedTheme = localStorage.getItem('lookataslam-theme') || 'warm';

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('lookataslam-theme', theme);
      themeButtons.forEach(b => b.classList.toggle('active', b.getAttribute('data-theme-btn') === theme));
    }
    applyTheme(savedTheme);

    themeButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        const t = btn.getAttribute('data-theme-btn');
        if (t) applyTheme(t);
      });
    });

    const novelSelect = document.getElementById('novelSelect');
    const chapterSelect = document.getElementById('chapterSelect');

    novelSelect.value = activeNovelKey;

    function populateChapterOptions() {
      chapterSelect.innerHTML = '';
      const novel = NOVELS[activeNovelKey];
      novel.chapters.forEach((ch, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        const numLabel = ch.chapterNumber ? `Ch ${ch.chapterNumber}` : `Ch ${idx + 1}`;
        opt.textContent = `${numLabel}: ${ch.title}`;
        chapterSelect.appendChild(opt);
      });
    }

    novelSelect.addEventListener('change', (e) => {
      activeNovelKey = e.target.value;
      populateChapterOptions();
      renderChapter(0);
    });

    populateChapterOptions();

    let scrollObserver = null;

    function renderParagraphs(paragraphs, container) {
      let totalWords = 0;
      if (scrollObserver) scrollObserver.disconnect();

      scrollObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('para-visible');
            scrollObserver.unobserve(entry.target);
          }
        });
      }, { threshold: 0.05, rootMargin: '0px 0px 200px 0px' });

      paragraphs.forEach((p, pIdx) => {
        const pElem = document.createElement('p');
        pElem.className = 'reading-para';
        pElem.textContent = p;
        container.appendChild(pElem);
        totalWords += p.split(/\s+/).filter(Boolean).length;

        if (pIdx < 5) {
          pElem.classList.add('para-visible');
        } else {
          scrollObserver.observe(pElem);
        }
      });

      const readMinutes = Math.max(1, Math.round(totalWords / 220));
      document.getElementById('wordCount').textContent = `${totalWords.toLocaleString()} words`;
      document.getElementById('readTime').textContent = `~${readMinutes} min read`;
    }

    async function renderChapter(idx) {
      const novel = NOVELS[activeNovelKey];
      if (idx < 0 || idx >= novel.chapters.length) return;
      currentChapter = idx;
      const ch = novel.chapters[idx];

      const numLabel = ch.chapterNumber ? `Chapter ${ch.chapterNumber}` : `Chapter ${idx + 1}`;
      document.getElementById('novelSeriesTitle').textContent = `${novel.title} · ${novel.genre}`;
      document.getElementById('chapterNum').textContent = numLabel;
      document.getElementById('chapterTitle').textContent = ch.title;
      document.getElementById('pageIndicator').textContent = `${idx + 1} / ${novel.chapters.length}`;
      chapterSelect.value = idx;

      const container = document.getElementById('readerText');
      container.innerHTML = '';

      // Check release date lock for Vol 2 chapters
      const now = new Date();
      if (ch.releaseDate && new Date(ch.releaseDate) > now) {
        if (activeNovelKey === 'jalwa_v2' && (ch.chapterNumber === 11 || idx === 0)) {
          container.innerHTML = `
            <div class="scheduled-lock-card">
              <span class="series-kicker" style="color: var(--accent);">Releasing December 10, 2026</span>
              <h3>${numLabel}: ${ch.title}</h3>
              <p>Chapter 11 will be <strong>free to read for 24 hours on launch day (Dec 10)</strong> so you can dive right back in with Ma'un and Naba.</p>
              <p style="font-size:0.9rem; color:var(--text-muted); margin:12px auto 20px;">The complete Volume 2 bundle (Chapters 11–20) releases on December 10.</p>
              <a href="index.html#subscribe" class="btn btn-primary btn-sm">Get an email on Dec 10 &rarr;</a>
            </div>
          `;
        } else if (activeNovelKey === 'jalwa_v2') {
          container.innerHTML = `
            <div class="scheduled-lock-card">
              <span class="series-kicker" style="color: var(--accent);">Volume 2 &middot; Paid Bundle</span>
              <h3>${numLabel}: ${ch.title}</h3>
              <p>Chapters 12 through 20 will be available on <strong>December 10, 2026</strong> as a complete paid bundle.</p>
              <p style="font-size:0.9rem; color:var(--text-muted); margin:12px auto 20px;">Chapter 11 will be free for 24 hours on launch day so you can read the opening before deciding on the rest of the volume.</p>
              <a href="index.html#subscribe" class="btn btn-primary btn-sm">Get notified when it drops &rarr;</a>
            </div>
          `;
        } else {
          container.innerHTML = `
            <div class="scheduled-lock-card">
              <span class="series-kicker" style="color: var(--accent);">Scheduled Release</span>
              <h3>${numLabel}: ${ch.title}</h3>
              <p>This chapter officially goes live on <strong>${ch.releaseDisplay}</strong>.</p>
              <a href="index.html#subscribe" class="btn btn-primary btn-sm">Get Email Notification &rarr;</a>
            </div>
          `;
        }
        document.getElementById('wordCount').textContent = 'Scheduled';
        document.getElementById('readTime').textContent = ch.releaseDisplay;
        return;
      }

      // Show loading state
      container.innerHTML = '<div style="padding:40px 0; text-align:center; color:var(--text-faint); font-size:0.9rem;">Loading chapter...</div>';
      document.getElementById('wordCount').textContent = '...';
      document.getElementById('readTime').textContent = '...';

      try {
        const res = await fetch(`/api/chapter?novel=${encodeURIComponent(activeNovelKey)}&ch=${idx}`);
        const data = await res.json();

        if (res.status === 402) {
          container.innerHTML = `
            <div class="scheduled-lock-card">
              <span class="series-kicker" style="color: var(--accent);">Volume 2 &middot; Paid Bundle</span>
              <h3>${numLabel}: ${ch.title}</h3>
              <p style="font-size:0.95rem; color:var(--text-muted); margin:12px auto 20px; line-height:1.6;">${data.error || 'This chapter is part of the complete Volume 2 paid bundle.'}</p>
              <div style="display:flex; justify-content:center; gap:10px; flex-wrap:wrap;">
                <a href="index.html#subscribe" class="btn btn-primary btn-sm">Get Launch Notification &rarr;</a>
                <a href="index.html#shelf" class="btn btn-secondary btn-sm">Back to Library</a>
              </div>
            </div>
          `;
          document.getElementById('wordCount').textContent = 'Bundle';
          document.getElementById('readTime').textContent = 'Paid Edition';
          return;
        }

        if (!res.ok) throw new Error('API error ' + res.status);

        container.innerHTML = '';
        if (data.paragraphs && data.paragraphs.length > 0) {
          renderParagraphs(data.paragraphs, container);

          // If reading Chapter 11 of Volume 2 (free hook), append the author note right below the final line
          if (activeNovelKey === 'jalwa_v2' && (ch.chapterNumber === 11 || idx === 0)) {
            const hookBox = document.createElement('div');
            hookBox.style.cssText = 'margin-top:48px; padding:32px 24px; border:2px solid var(--border); border-radius:16px; background:var(--bg-surface); text-align:center; box-shadow:var(--clay-shadow);';
            hookBox.innerHTML = `
              <span class="series-kicker" style="color:var(--accent);">A Note From the Author</span>
              <h3 style="font-size:1.35rem; margin:8px 0 10px;">The story continues in Volume 2</h3>
              <p style="font-size:0.95rem; color:var(--text-muted); max-width:500px; margin:0 auto 20px; line-height:1.65;">
                Hope you enjoyed stepping back into the apartment with them. Chapters 12 through 20 are releasing together on December 10 as a paid bundle so you can read their whole next chapter without waiting.
              </p>
              <div style="display:flex; justify-content:center; gap:10px; flex-wrap:wrap;">
                <a href="index.html#subscribe" class="btn btn-primary btn-sm">Email me on Dec 10 &rarr;</a>
                <a href="index.html#shelf" class="btn btn-secondary btn-sm">Back to Library</a>
              </div>
            `;
            container.appendChild(hookBox);
          }
        } else {
          container.innerHTML = '<p style="color:var(--text-muted);">Chapter content unavailable.</p>';
        }
      } catch (err) {
        container.innerHTML = '<p style="color:var(--text-muted);">Could not load chapter. Please refresh and try again.</p>';
        document.getElementById('wordCount').textContent = '';
        document.getElementById('readTime').textContent = '';
      }

      document.getElementById('prevBtn').disabled = (idx === 0);
      document.getElementById('prevBtn').style.opacity = (idx === 0) ? '0.35' : '1';
      document.getElementById('nextBtn').disabled = (idx === novel.chapters.length - 1);
      document.getElementById('nextBtn').style.opacity = (idx === novel.chapters.length - 1) ? '0.35' : '1';

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    chapterSelect.addEventListener('change', (e) => {
      renderChapter(parseInt(e.target.value, 10));
    });

    document.getElementById('prevBtn').addEventListener('click', () => {
      if (currentChapter > 0) renderChapter(currentChapter - 1);
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      const novel = NOVELS[activeNovelKey];
      if (currentChapter < novel.chapters.length - 1) renderChapter(currentChapter + 1);
    });

    // Font size controls
    document.getElementById('fontUp').addEventListener('click', () => {
      if (fontSizeRem < 1.55) {
        fontSizeRem += 0.08;
        document.getElementById('readerText').style.setProperty('--novel-font-size', `${fontSizeRem}rem`);
      }
    });

    document.getElementById('fontDown').addEventListener('click', () => {
      if (fontSizeRem > 0.95) {
        fontSizeRem -= 0.08;
        document.getElementById('readerText').style.setProperty('--novel-font-size', `${fontSizeRem}rem`);
      }
    });

    // Scroll progress bar
    window.addEventListener('scroll', () => {
      const scrollHeight = document.documentElement.scrollHeight - window.innerHeight;
      const progress = scrollHeight > 0 ? (window.scrollY / scrollHeight) * 100 : 0;
      document.getElementById('progressBar').style.width = `${progress}%`;
    });

    renderChapter(0);

    // ── COPY PROTECTION ──────────────────────────────────────────────────────
    // Allow selection (highlight) but block all copy mechanisms
    (function() {
      // 1. Block the native copy & cut clipboard events entirely
      document.addEventListener('copy', function(e) {
        e.preventDefault();
        e.stopPropagation();
        return false;
      }, true);

      document.addEventListener('cut', function(e) {
        e.preventDefault();
        e.stopPropagation();
        return false;
      }, true);

      // 2. Block keyboard shortcuts that copy or expose source
      document.addEventListener('keydown', function(e) {
        const key = e.key.toLowerCase();
        // Ctrl/Cmd + C, X, A, S, U, P — copy, cut, select-all, save, source, print
        if ((e.ctrlKey || e.metaKey) && ['c','x','s','u','p'].includes(key)) {
          e.preventDefault();
          e.stopPropagation();
          return false;
        }
        // F12 DevTools (doesn't truly block it, but signals intent)
        if (e.key === 'F12') {
          e.preventDefault();
          return false;
        }
      }, true);

      // 3. Override the clipboard write API
      try {
        Object.defineProperty(navigator, 'clipboard', {
          get: function() {
            return {
              writeText: () => Promise.resolve(),
              write: () => Promise.resolve(),
              readText: () => Promise.reject('blocked'),
              read: () => Promise.reject('blocked'),
            };
          }
        });
      } catch(err) {}

      // 4. Disable right-click context menu on the reader article only
      const readerArticle = document.getElementById('readerText');
      readerArticle?.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        return false;
      });

      // 5. Override execCommand copy/cut
      const _execCommand = document.execCommand.bind(document);
      document.execCommand = function(cmd) {
        if (['copy', 'cut'].includes(cmd.toLowerCase())) return false;
        return _execCommand.apply(document, arguments);
      };
    })();
  </script>
</body>
</html>
