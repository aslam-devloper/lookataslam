<!DOCTYPE html>
<html lang="en" data-theme="warm">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reader — Just a Little While Apart (Vol. 1)</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>

  <style>
    /* Reader dedicated styles */
    .reader-navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--nav-bg);
      backdrop-filter: blur(14px);
      border-bottom: 2px solid var(--border-subtle);
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }

    .back-home {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .reader-settings {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .chapter-select {
      font-family: inherit;
      font-weight: 700;
      font-size: 0.88rem;
      padding: 6px 14px;
      border-radius: var(--btn-radius);
      border: 2px solid var(--border);
      background: var(--bg-surface);
      color: var(--text-main);
      outline: none;
    }

    .size-btn {
      border: 2px solid var(--border);
      background: var(--bg-surface);
      color: var(--text-main);
      border-radius: var(--btn-radius);
      padding: 4px 10px;
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .reading-progress {
      position: fixed;
      top: 0;
      left: 0;
      height: 4px;
      background: var(--accent);
      z-index: 101;
      width: 0%;
      transition: width 0.1s ease-out;
    }

    .reader-wrapper {
      max-width: 720px;
      margin: 40px auto 100px;
      padding: 0 24px;
    }

    .reader-chapter-meta {
      text-align: center;
      margin-bottom: 40px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .novel-series-label {
      font-size: 0.8rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .chapter-headline {
      font-family: 'Newsreader', Georgia, serif;
      font-size: clamp(2rem, 5vw, 2.75rem);
      font-weight: 600;
      line-height: 1.15;
      margin-bottom: 6px;
    }

    .chapter-number-label {
      font-size: 0.95rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .novel-body {
      font-family: 'Newsreader', Georgia, serif;
      font-size: var(--novel-font-size, 1.25rem);
      line-height: 1.8;
      color: var(--text-main);
    }

    .novel-body p {
      margin-bottom: 1.6em;
      text-indent: 1.6em;
    }

    .novel-body p:first-of-type {
      text-indent: 0;
    }

    .reader-nav-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 50px;
      padding-top: 30px;
      border-top: 2px solid var(--border-subtle);
      gap: 16px;
    }
  </style>
</head>
<body>

  <div class="reading-progress" id="progressBar"></div>

  <!-- Reader Top Bar -->
  <nav class="reader-navbar">
    <a href="index.html" class="back-home">&larr; lookataslam</a>

    <div class="reader-settings">
      <select id="chapterSelect" class="chapter-select" aria-label="Select Chapter"></select>
      
      <div class="theme-picker" role="radiogroup" aria-label="Theme selection">
        <button class="theme-pill active" data-theme-btn="warm">Warm</button>
        <button class="theme-pill" data-theme-btn="night">Night</button>
        <button class="theme-pill" data-theme-btn="sage">Sage</button>
      </div>

      <button id="fontDown" class="size-btn" aria-label="Decrease font size">A-</button>
      <button id="fontUp" class="size-btn" aria-label="Increase font size">A+</button>
    </div>
  </nav>

  <!-- Reading Layout -->
  <main class="reader-wrapper">
    <header class="reader-chapter-meta">
      <div class="novel-series-label">Just a Little While Apart &middot; Volume 1</div>
      <div class="chapter-number-label" id="chapterNum">Chapter 1</div>
      <h1 class="chapter-headline" id="chapterTitle">A Dart of Marriage</h1>
    </header>

    <article class="novel-body" id="readerText">
      <!-- Paragraphs rendered by JavaScript -->
    </article>

    <div class="reader-nav-footer">
      <button id="prevBtn" class="btn btn-secondary">&larr; Previous</button>
      <span id="pageIndicator" style="font-weight: 700; font-size: 0.9rem;">1 / 10</span>
      <button id="nextBtn" class="btn btn-primary">Next &rarr;</button>
    </div>
  </main>

  <script src="chapters-data.js"></script>
  <script>
    let currentChapter = 0;
    let fontSizeRem = 1.25;

    // Theme logic
    const themeButtons = document.querySelectorAll('[data-theme-btn]');
    const savedTheme = localStorage.getItem('lookataslam-theme') || 'warm';

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('lookataslam-theme', theme);
      themeButtons.forEach(b => b.classList.toggle('active', b.getAttribute('data-theme-btn') === theme));
    }
    applyTheme(savedTheme);

    themeButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        const t = btn.getAttribute('data-theme-btn');
        if (t) applyTheme(t);
      });
    });

    // Populate chapters
    const select = document.getElementById('chapterSelect');
    if (typeof CHAPTERS !== 'undefined') {
      CHAPTERS.forEach((ch, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = `Ch ${idx + 1}: ${ch.title}`;
        select.appendChild(opt);
      });
    }

    function renderChapter(idx) {
      if (idx < 0 || idx >= CHAPTERS.length) return;
      currentChapter = idx;
      const ch = CHAPTERS[idx];

      document.getElementById('chapterNum').textContent = `Chapter ${idx + 1}`;
      document.getElementById('chapterTitle').textContent = ch.title;
      document.getElementById('pageIndicator').textContent = `${idx + 1} / ${CHAPTERS.length}`;
      select.value = idx;

      const container = document.getElementById('readerText');
      container.innerHTML = '';
      ch.paragraphs.forEach(p => {
        const pElem = document.createElement('p');
        pElem.textContent = p;
        container.appendChild(pElem);
      });

      document.getElementById('prevBtn').disabled = (idx === 0);
      document.getElementById('prevBtn').style.opacity = (idx === 0) ? '0.4' : '1';
      document.getElementById('nextBtn').disabled = (idx === CHAPTERS.length - 1);
      document.getElementById('nextBtn').style.opacity = (idx === CHAPTERS.length - 1) ? '0.4' : '1';

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    select.addEventListener('change', (e) => {
      renderChapter(parseInt(e.target.value, 10));
    });

    document.getElementById('prevBtn').addEventListener('click', () => {
      if (currentChapter > 0) renderChapter(currentChapter - 1);
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      if (currentChapter < CHAPTERS.length - 1) renderChapter(currentChapter + 1);
    });

    // Font size controls
    document.getElementById('fontUp').addEventListener('click', () => {
      if (fontSizeRem < 1.6) {
        fontSizeRem += 0.08;
        document.getElementById('readerText').style.setProperty('--novel-font-size', `${fontSizeRem}rem`);
      }
    });

    document.getElementById('fontDown').addEventListener('click', () => {
      if (fontSizeRem > 1.0) {
        fontSizeRem -= 0.08;
        document.getElementById('readerText').style.setProperty('--novel-font-size', `${fontSizeRem}rem`);
      }
    });

    // Scroll progress bar
    window.addEventListener('scroll', () => {
      const scrollHeight = document.documentElement.scrollHeight - window.innerHeight;
      const progress = scrollHeight > 0 ? (window.scrollY / scrollHeight) * 100 : 0;
      document.getElementById('progressBar').style.width = `${progress}%`;
    });

    // Initial render
    if (typeof CHAPTERS !== 'undefined' && CHAPTERS.length > 0) {
      renderChapter(0);
    }
  </script>
</body>
</html>
